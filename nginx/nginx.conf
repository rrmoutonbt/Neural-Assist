worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_backend {
        server banc-api:5000;
    }

    # HTTP - redirect to HTTPS + ACME challenge
    server {
        listen 80;
        server_name banc-of-el-trust-international.org;

        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name banc-of-el-trust-international.org;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Static HTML pages served directly
        location ~ ^/(login|signup|dashboard|accounts|wallet|trading|live-trading|transactions|loans|reports|ppm|dynasty|gold|institutional-trader|iso_catalogue|aum|verify|forgot-password|reset-password|banc_of_el_ecosystem|index-legacy|index-updated|programs|library|pdf-viewer|trade-tracker-3d-background|BeeBot_3D_Architecture|architecture-diagram)\.html$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # Static directories served directly
        location ~ ^/(blockchain-control-room|admin|crypto|unified|programs|css|js|assets|books)/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        # Static media from old site
        location /digitalworld.mp4 {
            root /usr/share/nginx/html;
        }

        # --- Neural Assistant API (port 8000) ---
        location /neural/ws/ {
            proxy_pass http://neural-assistant:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location /neural/ {
            proxy_pass http://neural-assistant:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120;
        }

        # --- Deal Flow CRM: Deal Service API (port 8002) ---
        location /dealflow-api/ {
            proxy_pass http://172.18.0.1:8002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
        }

        # --- Deal Flow CRM: Extraction Service API (port 8003) ---
        location /dealflow-extract/ {
            proxy_pass http://172.18.0.1:8003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
            proxy_read_timeout 120;
        }

        # --- Deal Flow CRM: Profile Service API (port 8004) ---
        location /profile-api/ {
            proxy_pass http://172.18.0.1:8004/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
        }

        # --- Deal Flow CRM: Network Service WebSocket (port 8005) ---
        location /network-api/ws/ {
            proxy_pass http://172.18.0.1:8005/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # --- Deal Flow CRM: Network Service API (port 8005) ---
        location /network-api/ {
            proxy_pass http://172.18.0.1:8005/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
        }

        # --- Uploaded media (profile photos, post media) ---
        location /uploads/ {
            alias /var/opendoor/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # --- VAUDIO Transcription Engine (port 8001) ---
        location /vaudio/ {
            proxy_pass http://172.18.0.1:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 1100M;
            proxy_read_timeout 600;
            proxy_buffering off;
        }

        # --- i Platform (port 3001) ---
        location /i-platform/ {
            proxy_pass http://172.18.0.1:3001/i-platform/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # --- TrustBook PWA (static production build) ---
        location /trustbook/ {
            alias /usr/share/nginx/html/trustbook/;
            add_header Cross-Origin-Opener-Policy same-origin-allow-popups;
            add_header Cross-Origin-Embedder-Policy credentialless;
            try_files $uri $uri/ /trustbook/index.html;
        }

        # --- TrustBook Relay API (port 4000) ---
        location /trustbook-relay/ {
            proxy_pass http://172.18.0.1:4000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # --- Construct Platform landing page ---
        location = /programs/construct-universal/ {
            root /usr/share/nginx/html;
            try_files /programs/construct-universal/index.html =404;
        }
        location = /programs/construct-universal/index.html {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # --- CONSTRUCT2 SPA (React client-side routing) ---
        location ^~ /programs/construct-universal/construct2 {
            root /usr/share/nginx/html;
            try_files $uri /programs/construct-universal/construct2.html;
        }

        # --- Construct static assets (JS/CSS/fonts) ---
        location ^~ /programs/construct-universal/assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # --- CONSTRUCT2 Blockchain API (port 8501) ---
        location /construct2-api/ws/ {
            proxy_pass http://172.18.0.1:8501/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location /construct2-api/ {
            proxy_pass http://172.18.0.1:8501/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Construct Universal API (port 8500) ---
        location /construct-api/ {
            proxy_pass http://172.18.0.1:8500/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Construct Universal WebSocket ---
        location /construct-api/ws/ {
            proxy_pass http://172.18.0.1:8500/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Homepage and Next.js 3D app
        location / {
            proxy_pass http://172.18.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # API proxy
        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://api_backend/health;
        }

        # --- LadderBot API (proxied, no direct UI access) ---
        location /ladderbot/api/ {
            proxy_pass http://ladderbot:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- TradeLocker API + WebSocket (port 8082) ---
        location /tradelocker/api/ {
            proxy_pass http://172.17.0.1:8082/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /tradelocker/ws {
            proxy_pass http://172.17.0.1:8082/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # --- Cognitive Network API + WebSocket (port 8765) ---
        location /cognitive/api/ {
            proxy_pass http://172.17.0.1:8765/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /cognitive/ws {
            proxy_pass http://172.17.0.1:8765/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location /cognitive/health {
            proxy_pass http://172.17.0.1:8765/health;
        }

        # --- BeeBot API (port 8080) ---
        location /beebot/api/ {
            proxy_pass http://172.17.0.1:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /beebot/ws {
            proxy_pass http://172.17.0.1:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # --- TradeLocker Demo API + WebSocket (port 8083) ---
        location /tradelocker-demo/api/ {
            proxy_pass http://172.17.0.1:8083/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /tradelocker-demo/ws {
            proxy_pass http://172.17.0.1:8083/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # --- TradeLocker Dashboard static files ---
        location /trader-dashboard/ {
            alias /usr/share/nginx/trader-dashboard/;
            try_files $uri $uri/ =404;
        }
    }
}
