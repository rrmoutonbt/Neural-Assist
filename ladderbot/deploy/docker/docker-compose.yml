# LadderBot single-service docker-compose for a WTT-adjacent VPS.
#
#   cd deploy/docker
#   cp .env.example .env         # edit values
#   docker compose up -d --build
#
# Ports:
#   5000 → API + in-process static UI
#
# For an Nginx-fronted setup on the same host, drop the container's
# published port and reverse-proxy the internal container port instead.

services:
  ladderbot:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ladderbot:latest
    container_name: ladderbot
    restart: unless-stopped
    ports:
      - "${LADDER_HOST_PORT:-5000}:5000"
    environment:
      LADDER_DB_PATH:       /var/lib/ladderbot/ladder.db
      LADDER_REPORT_DIR:    /var/lib/ladderbot/out/ladder_run
      LADDER_UI_DIST_DIR:   /srv/ladderbot-ui
      LADDER_BAR_SOURCE:    "${LADDER_BAR_SOURCE:-synthetic}"
      LADDER_CORS_ORIGINS:  "${LADDER_CORS_ORIGINS:-*}"
      GUNICORN_WORKERS:     "${GUNICORN_WORKERS:-2}"
      GUNICORN_TIMEOUT:     "${GUNICORN_TIMEOUT:-60}"
    volumes:
      - ladderbot_state:/var/lib/ladderbot
    healthcheck:
      test: ["CMD-SHELL",
             "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/ladder/health',timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ladderbot_state:
    name: ladderbot_state
