# /etc/nginx/sites-available/ladderbot.conf
#
# Fronts LadderBot on a WTT-adjacent VPS:
#   - Serves the built React UI from /srv/ladderbot-ui
#   - Reverse-proxies /api/ladder → the gunicorn upstream on 127.0.0.1:5000
#
# Assumes:
#   - /srv/ladderbot-ui contains ui/dist-ladder/ contents
#   - ladderbot-api.service is running on 127.0.0.1:5000
#   - Certbot / your CA of choice put certs at the paths below
#
# Symlink into sites-enabled and reload nginx after editing:
#   ln -s /etc/nginx/sites-available/ladderbot.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

upstream ladderbot_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

# Redirect http → https.
server {
    listen 80;
    listen [::]:80;
    server_name ladder.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ladder.example.com;

    ssl_certificate     /etc/letsencrypt/live/ladder.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ladder.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Basic hardening.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── UI ──────────────────────────────────────────────────────────
    root /srv/ladderbot-ui;
    index index.html;

    # Long-cache hashed assets (webpack contenthash filenames).
    location ~* \.(js|css|map|woff2?|png|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback so the frontend can own its own routing later.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API ─────────────────────────────────────────────────────────
    location /api/ladder/ {
        proxy_pass         http://ladderbot_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
