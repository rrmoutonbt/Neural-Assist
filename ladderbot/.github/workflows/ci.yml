name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Python — pytest matrix on 3.11 + 3.12
  # -------------------------------------------------------------------------
  python:
    name: python / pytest ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,schwab,yfinance]'

      - name: pytest
        run: pytest tests/ -q

      - name: smoke — CLI entry points import cleanly
        run: |
          python -c "from ladderbot.api.serve import main; assert main"
          python scripts/run_pipeline.py --help > /dev/null

  # -------------------------------------------------------------------------
  # Frontend — jest + type-check + production build
  # -------------------------------------------------------------------------
  frontend:
    name: frontend / jest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: install
        run: npm ci

      - name: type-check
        run: npm run type-check

      - name: jest
        run: npm test -- --ci --coverage=false

      - name: production build
        run: npm run build

      - name: upload bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ladder-ui-dist
          path: ui/dist-ladder/
          retention-days: 14

  # -------------------------------------------------------------------------
  # Single required check — set this as the required status in branch
  # protection so both jobs must pass without pinning individual matrix
  # entries.
  # -------------------------------------------------------------------------
  ci:
    name: ci passed
    runs-on: ubuntu-latest
    needs: [python, frontend]
    if: always()
    steps:
      - name: aggregate result
        run: |
          if [ "${{ needs.python.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "python=${{ needs.python.result }} frontend=${{ needs.frontend.result }}"
            exit 1
          fi
          echo "all green"
