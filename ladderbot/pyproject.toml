[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ladderbot"
version = "0.1.0"
description = "Futures-options trading bot enforcing the ladder methodology: score ≥ 90 gate, 12-trade cycle, fixed target, no stop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "rrmoutonbt" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "flask>=3.0",
  "flask-cors>=4.0",
]

[project.optional-dependencies]
schwab = ["requests>=2.31", "websockets>=12.0"]
yfinance = ["yfinance>=0.2"]
prod = ["gunicorn>=21.2"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
ladderbot-serve   = "ladderbot.api.serve:main"
ladderbot-run     = "scripts.run_pipeline:main"

[tool.setuptools.packages.find]
include = ["ladderbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
